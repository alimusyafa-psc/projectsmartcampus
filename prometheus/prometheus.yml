global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "laravel_app"
    metrics_path: /metrics
    static_configs:
      - targets: ["laravel_app:9000"]

  - job_name: "laravel_nginx"
    metrics_path: /metrics
    static_configs:
      - targets: ["laravel_nginx:8080"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
