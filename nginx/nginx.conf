worker_processes auto;

events {
    worker_connections 1024;  # Adjust this based on your load requirements
}

http {
    upstream laravel_backend {
        # Define the backend servers for load balancing
        server laravel_app1:9000;
        server laravel_app2:9000;
        server laravel_app3:9000;
    }

    server {
        listen 80;
        server_name localhost;  # Set this to your domain or IP if needed

        # Define the root directory for your Laravel application
        root /var/www/html/public;
        index index.php index.html index.htm;

        # Handling the main request with fallback to index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM handling
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass laravel_backend;  # Pass to the upstream backend
            fastcgi_index index.php;

            # Fix: Corrected the script filename variable
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;

            # Timeouts for fastcgi
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;

            # Buffers for handling large PHP responses
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }

        # Disable direct access to .git or other hidden files
        location ~ /\. {
            deny all;
        }

        # Laravel metrics route for Prometheus (this should be served by your app containers)
        location /metrics {
            # Adjust the backend service for Laravel metrics route
            proxy_pass http://laravel_app1:9000/metrics;  # Example for app1, adjust as needed
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Nginx status page (accessible only from localhost or trusted IPs)
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;  # Allow localhost access
            deny all;  # Deny all other IPs
        }

        # Optional: Increase client body size if necessary (for larger uploads)
        client_max_body_size 100M;  # Adjust as needed for your application
    }

    # Additional optional configurations (gzip, caching, etc.)
    # Enable Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}


