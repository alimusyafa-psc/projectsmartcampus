events {}

http {
    # Upstream configuration untuk load balancing Round Robin
    upstream laravel_backend {
        server laravel_app1:9001;
        server laravel_app2:9002;
        server laravel_app3:9003;
    }

    # Server yang menangani aplikasi dengan load balancing
    server {
        listen 8080;

        location / {
            proxy_pass http://laravel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: Error log
        error_log /var/log/nginx/laravel_error.log;
        access_log /var/log/nginx/laravel_access.log;
    }

    # Server untuk monitoring status NGINX
    server {
        listen 8090;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;   # Hanya bisa akses dari localhost
            deny all;          # Menolak akses dari selain localhost
        }

        # Optional: Error log untuk status page
        error_log /var/log/nginx/status_error.log;
        access_log /var/log/nginx/status_access.log;
    }
}
