upstream php-upstream {
    server laravel_app:9000;  # Nama service Laravel di docker-compose
}

server {
    listen 80;
    server_name 192.168.0.103;

    root /var/www/html/public;
    index index.php index.html index.htm;

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files processing
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-upstream;  # gunakan upstream, jangan dobel
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Protect .ht files
    location ~ /\.ht {
        deny all;
    }

    # Laravel metrics route for Prometheus
    location /metrics {
        proxy_pass http://laravel_app:9000/metrics;  # Fix: use laravel_app service instead of app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # NGINX internal status page (for Prometheus too, optional)
    location /status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.19.0.0/16;  # Docker subnet
        allow 172.18.0.0/16;
        allow all;  # Deny access to others
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}
