worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream laravel_backend {
        server laravel_app1:9000;
        server laravel_app2:9000;
        server laravel_app3:9000;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php index.html index.htm;

        # Serve static files (CSS, JS, IMG, etc.) langsung dari disk
        location /assets/ {
            alias /var/www/html/public/assets/;
            access_log off;
            expires 30d;
        }

        location /css/ {
            alias /var/www/html/public/css/;
            access_log off;
            expires 30d;
        }

        location /js/ {
            alias /var/www/html/public/js/;
            access_log off;
            expires 30d;
        }

        location /img/ {
            alias /var/www/html/public/img/;
            access_log off;
            expires 30d;
        }

        location /fonts/ {
            alias /var/www/html/public/fonts/;
            access_log off;
            expires 30d;
        }

        location /favicon.ico {
            alias /var/www/html/public/favicon.ico;
            access_log off;
            expires 30d;
        }

        # Main request handler
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM pass
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass laravel_backend;
            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }

        # Block access hidden files
        location ~ /\. {
            deny all;
        }

        # Metrics endpoint for Prometheus (jika Laravel punya /metrics endpoint)
        location /metrics {
            proxy_pass http://laravel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Nginx status page
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }

        client_max_body_size 100M;
    }

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/woff2 font/woff font/ttf font/otf image/svg+xml;
    gzip_vary on;
}
