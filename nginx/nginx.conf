worker_processes auto;

events {
    worker_connections 1024;  # Adjust this based on your load requirements
}

http {
    upstream laravel_backend {
        # Define the backend servers for load balancing
        server laravel_app1:9000;
        server laravel_app2:9000;
        server laravel_app3:9000;
    }

    server {
        listen 80;
        server_name localhost;  # Set this to your domain or IP if needed

        # Define the root directory for your Laravel application
        root /var/www/html/public;
        index index.php index.html index.htm;

        # Handling the main request with fallback to index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM handling
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass laravel_backend;  # Pass to the upstream backend
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        }

        # Disable direct access to .git or other hidden files
        location ~ /\. {
            deny all;
        }

        # Nginx status page (accessible only from localhost or trusted IPs)
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;  # Allow localhost access
            deny all;  # Deny all other IPs
        }

        # Optional: Increase client body size if necessary (for larger uploads)
        client_max_body_size 100M;  # Adjust as needed for your application
    }

    # Additional optional configurations (gzip, caching, etc.)
    # gzip on;
    # gzip_types text/plain application/javascript application/json text/css application/xml;
    # gzip_min_length 1024;
}

