http {
    upstream app_servers {
        # Round-robin load balancing untuk aplikasi app1, app2, dan app3
        server app1:9001;
        server app2:9002;
        server app3:9003;
    }

    server {
        listen 8080;  # Port untuk mengakses aplikasi melalui load balancer

        location / {
            proxy_pass http://app_servers;  # Forward traffic ke upstream app_servers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Konfigurasi untuk monitoring status NGINX
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;   # Hanya localhost yang diizinkan mengakses
            deny all;          # Menolak semua akses lainnya
        }
    }
}
