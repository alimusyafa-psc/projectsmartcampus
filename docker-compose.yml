version: "3.7"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/node_modules
        env_file:
            - .env
        networks:
            - laravel_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
            interval: 30s
            timeout: 3s
            retries: 3

    nginx:
        image: nginx:latest
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_network

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        platform: linux/arm64 # Tambahkan ini untuk memastikan berjalan di ARM64
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        networks:
            - laravel_network

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        volumes:
            - grafana-storage:/var/lib/grafana
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge

volumes:
    grafana-storage:
