version: "3.8"
services:
    app:
        build:
            context: ./app
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./app:/var/www/html
        networks:
            - laravel_network
        depends_on:
            - nginx

    nginx:
        image: nginx:latest
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8080:80" # Laravel sekarang diakses melalui port 8080
        volumes:
            - ./app:/var/www/html
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel_network
        depends_on:
            - app

networks:
    laravel_network:
        driver: bridge
