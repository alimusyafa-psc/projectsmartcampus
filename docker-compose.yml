services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html:delegated
            - /var/www/html/vendor
            - /var/www/html/node_modules
        env_file:
            - .env
        networks:
            - laravel_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
            interval: 30s
            timeout: 3s
            retries: 3

    nginx:
        image: nginx:latest
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - .:/var/www/html:delegated
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_network

nginx_exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: nginx_exporter
    ports:
        - "9113:9113"
    command:
        - "-nginx.scrape-uri=http://nginx/status"
    depends_on:
        - nginx
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
        - laravel_network

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        networks:
            - laravel_network

    redis_exporter:
        image: oliver006/redis_exporter
        container_name: redis_exporter
        depends_on:
            - redis
        environment:
            - REDIS_ADDR=redis:6379
        ports:
            - "9121:9121"
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge
