version: "3.8"

services:
    app1:
        build:
            context: ./app1
            dockerfile: Dockerfile
        container_name: laravel_app1
        working_dir: /var/www/html
        volumes:
            - ./app1:/var/www/html:delegated
            - /var/www/html/vendor
            - /var/www/html/node_modules
        env_file:
            - .env
        networks:
            - laravel_network
        ports:
            - "9000:9000"

    app2:
        build:
            context: ./app2
            dockerfile: Dockerfile
        container_name: laravel_app2
        working_dir: /var/www/html
        volumes:
            - ./app2:/var/www/html:delegated
            - /var/www/html/vendor
            - /var/www/html/node_modules
        env_file:
            - .env
        networks:
            - laravel_network
        ports:
            - "9001:9001"

    app3:
        build:
            context: ./app3
            dockerfile: Dockerfile
        container_name: laravel_app3
        working_dir: /var/www/html
        volumes:
            - ./app3:/var/www/html:delegated
            - /var/www/html/vendor
            - /var/www/html/node_modules
        env_file:
            - .env
        networks:
            - laravel_network
        ports:
            - "9002:9002"

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        networks:
            - laravel_network

    redis_exporter:
        image: oliver006/redis_exporter
        container_name: redis_exporter
        depends_on:
            - redis
        environment:
            - REDIS_ADDR=redis:6379
        ports:
            - "9121:9121"
        networks:
            - laravel_network

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: nginx
        ports:
            - "80:8081"
            - "81:8082"
            - "82:8083"
        depends_on:
            - app1
            - app2
            - app3
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge
